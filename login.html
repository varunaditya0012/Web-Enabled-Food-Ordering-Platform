<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuickBite</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/features.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            padding: 24px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #E2E8F0;
            animation: modalFadeIn 0.35s ease-out;
        }

        .auth-logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #121212;
            margin-bottom: 24px;
            display: inline-block;
            letter-spacing: -1px;
        }

        .auth-logo span {
            color: #E31837;
        }

        .password-field-wrap {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #64748B;
        }

        .error-msg {
            color: #E31837;
            background: #FEE2E2;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #E31837;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">Quick<span>Bite</span></a>
            <h2 style="margin-bottom: 8px; font-weight:800;">Welcome Back</h2>
            <p style="color:#64748B; font-size:0.95rem; margin-bottom:24px;">Log in to track your orders and fast checkout</p>

            <!-- 1-Click Demo Helper -->
            <div class="demo-badge-box">
                <div>⚡ <strong>Quick Testing Credentials:</strong></div>
                <div style="margin-top:4px;">Email: <code>user@quickbite.com</code> | Pass: <code>123456</code></div>
                <button type="button" class="demo-autofill-btn" id="autofill-demo-btn">Auto-fill Demo Account</button>
            </div>

            <div id="error-msg" class="error-msg">Invalid credentials</div>

            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <div class="password-field-wrap">
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" class="password-toggle-btn" id="toggle-password" title="Show/Hide Password">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding:14px; font-size:1rem; margin-top:10px;">Log In</button>
            </form>

            <div class="auth-footer" style="margin-top: 24px; font-size:0.95rem; color:#64748B;">
                Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:700;">Create one</a>
            </div>
            <div style="margin-top: 14px;">
                <a href="index.html" style="color:#94A3B8; font-size:0.85rem;">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // 1-Click Demo Fill
        document.getElementById('autofill-demo-btn').addEventListener('click', () => {
            document.getElementById('email').value = 'user@quickbite.com';
            document.getElementById('password').value = '123456';
        });

        // Show/Hide Password Toggle
        const toggleBtn = document.getElementById('toggle-password');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            toggleBtn.textContent = isPassword ? '🙈' : '👁️';
        });

        // Form Submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = e.target.querySelector('button[type="submit"]');

            btn.textContent = 'Logging in...';
            btn.disabled = true;

            const result = await ApiService.login(email, password);

            if (result.success) {
                btn.textContent = 'Success! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);
            } else {
                errorMsg.textContent = result.message;
                errorMsg.style.display = 'block';
                btn.textContent = 'Log In';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
